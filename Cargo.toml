[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/porch"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = true
repository = "https://github.com/jayden-dang/porch"
homepage = "https://github.com/jayden-dang/porch"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
fs4 = "0.13"
hex = "0.4"
nix = { version = "0.30", features = ["process", "signal"] }
predicates = "3"
ratatui = "0.29"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "process", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
# Internal slices: path for the workspace, version so `cargo publish` works.
porch-git = { version = "0.2.1", path = "crates/porch-git" }
porch-gate = { version = "0.2.1", path = "crates/porch-gate" }
porch-review = { version = "0.2.1", path = "crates/porch-review" }
porch-agent = { version = "0.2.1", path = "crates/porch-agent" }
porch-deliver = { version = "0.2.1", path = "crates/porch-deliver" }
porch-run = { version = "0.2.1", path = "crates/porch-run" }
porch-quality = { version = "0.2.1", path = "crates/porch-quality" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
