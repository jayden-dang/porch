[package]
name = "porch"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = true
description = "Local git gate: push to porch, review and certify before origin"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["git", "cli", "review", "gate"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/target/", "/.research/", "/.skills/", "/.remember/"]

[[bin]]
name = "porch"
path = "src/main.rs"

[[bin]]
name = "porch-quality"
path = "src/bin/porch_quality.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
porch-agent.workspace = true
porch-gate.workspace = true
porch-quality.workspace = true
porch-review.workspace = true
porch-run.workspace = true
ratatui.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
porch-agent.workspace = true
porch-deliver.workspace = true
porch-gate.workspace = true
porch-git.workspace = true
porch-review.workspace = true
predicates.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
