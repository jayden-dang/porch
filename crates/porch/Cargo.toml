[package]
name = "porch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
# false until path-dep slices are publishable (E1); metadata kept for a later crates.io cut
publish = false
description = "Local git gate: push to porch, review and certify before origin"
repository = "https://github.com/jayden-dang/porch"
homepage = "https://github.com/jayden-dang/porch"
readme = "../../README.md"
keywords = ["git", "cli", "review", "gate"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/target/", "/.research/", "/.skills/", "/.remember/"]

[[bin]]
name = "porch"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
porch-agent = { path = "../porch-agent" }
porch-gate = { path = "../porch-gate" }
porch-run = { path = "../porch-run" }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
porch-agent = { path = "../porch-agent" }
porch-deliver = { path = "../porch-deliver" }
porch-gate = { path = "../porch-gate" }
porch-git = { path = "../porch-git" }
porch-review = { path = "../porch-review" }
predicates.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
